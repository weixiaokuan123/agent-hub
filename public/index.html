<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub · 本地账号与签到面板</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #8b93a7; --accent: #5b8cff; --ok: #35c98a;
    --warn: #e0a234; --err: #e05252; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  header .sp { flex: 1; }
  .muted { color: var(--dim); font-size: 12.5px; }
  button { background: var(--card2); color: var(--fg); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .card h2 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .row .k { color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ok { background: var(--ok); } .off { background: #4a5060; } .warn { background: var(--warn); } .err { background: var(--err); }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .signin-box { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .streak { font-size: 22px; font-weight: 700; }
  .big { font-size: 16px; font-weight: 650; }
  .footer-note { margin-top: 26px; }
  code { background: var(--card2); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; }
  #toast { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 9px; max-width: 360px; font-size: 13px; }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Agent Hub</h1>
  <span class="tag" id="keyTag">未连接</span>
  <span class="tag" id="creditTag" title="WorkBuddy 全部账号积分总额">积分 —</span>
  <span class="sp"></span>
  <span class="muted" id="updated"></span>
  <button onclick="refresh()">刷新</button>
  <button class="primary" onclick="claimAll()">全部签到</button>
</header>
<main>
  <div class="grid" id="creditGrid"></div>
  <div class="grid" id="grid"></div>
  <p class="muted footer-note">
    数据来自本机各代理的回环接口（WorkBuddy 39301/39302、Trae 39303/39304、MiniMax 39305/39306）。
    本面板不接触任何凭据，只做聚合展示与「立即签到」。自动签到默认每天 7–10 点随机执行，由各代理自身完成。
  </p>
</main>
<div id="toast"></div>
<script>
const LS_KEY = 'agent-hub-key'
let HUB_KEY = localStorage.getItem(LS_KEY) || ''

// 首次通过 ?key= 带入并保存
const urlKey = new URLSearchParams(location.search).get('key')
if (urlKey) {
  HUB_KEY = urlKey
  localStorage.setItem(LS_KEY, urlKey)
  history.replaceState({}, '', location.pathname)
}

function toast(msg, kind = '') {
  const el = document.createElement('div')
  el.className = 'toast ' + kind
  el.textContent = msg
  document.getElementById('toast').appendChild(el)
  setTimeout(() => el.remove(), 5000)
}

async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization: 'Bearer ' + HUB_KEY, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  })
  if (res.status === 401) throw new Error('面板 key 无效或缺失')
  const data = await res.json().catch(() => null)
  if (!res.ok) throw new Error((data && (data.error || data.message)) || ('HTTP ' + res.status))
  return data
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

/** 错误文案只留首句并限长，避免撑爆卡片；完整内容放在 title 里 hover 可看。 */
function brief(msg, max = 60) {
  const s = String(msg)
  const head = s.split(/[；;。]/)[0]
  return head.length > max ? head.slice(0, max) + '…' : head
}

function authOf(r) {
  const a = r.auth || {}
  if (r.running === false) return { cls: 'off', text: '服务未运行' }
  if (a.state === 'signed-in') return { cls: 'ok', text: '已登录 ' + esc(a.account || a.uin || '') }
  if (a.state === 'expired') return { cls: 'warn', text: 'token 已过期' }
  if (a.state === 'signed-out') return { cls: 'off', text: '未登录' }
  if (a.state === 'no-key') return { cls: 'warn', text: '缺 key（首次启动后重试）' }
  // 兜底截断：代理的错误文案有可能很长（曾经把整张卡片撑爆过一次），
  // 面板上只留首句，完整内容放 title 里 hover 可看。
  const msg = String(a.message || a.state || '未知')
  return { cls: 'err', text: esc(brief(msg)), full: esc(msg) }
}

function signinHtml(r) {
  if (!r.signin) return '<div class="row muted">签到：不可用</div>'
  const s = r.signin
  // 逐目标明细优先。代理侧一个区域可能对应多个签到账号（本端口自身 + 账号库），
  // 只显示本端口会把「某个入口坏了」误报成「签到坏了」。
  const targets = Array.isArray(s.targets) ? s.targets : []
  const claimedCount = typeof s.claimedCount === 'number'
    ? s.claimedCount
    : targets.filter(t => t.claimedToday).length

  if (targets.length > 0) {
    const rows = targets.map(t => {
      const badge = t.claimedToday
        ? '<span class="dot ok"></span> 已领'
        : '<span class="dot warn"></span> 待领'
      const when = t.claimedToday ? esc(t.lastResult || '已领取') : ('计划 ' + esc(t.scheduledAt || '-'))
      return `<div class="row"><span class="k">${esc(t.label)}</span><span>${badge}</span>` +
        `<span class="muted">${when}</span></div>`
    }).join('')
    const allDone = claimedCount >= targets.length
    return `
    <div class="signin-box">
      <div class="row"><span class="k">今日签到</span><span>${claimedCount} / ${targets.length} 已领</span></div>
      ${rows}
      <div class="row" style="margin-top:8px">
        <span></span>
        <button onclick="claim('${esc(r.id)}')" ${allDone ? 'disabled' : ''}>立即签到</button>
      </div>
    </div>`
  }

  // 无明细（其它代理或旧版 workbuddy-proxy）：退回单账号视图。
  if (s.error) return '<div class="row muted" title="' + esc(s.error) + '">签到：' + esc(brief(s.error)) + '</div>'
  const raw = s.view || {}
  const nest = raw.panel || {}          // MiniMax: view.panel.{checkedInToday,streak,todayPoints}
  const checkedIn = raw.checkedIn === true || raw.todayCheckedIn === true || nest.checkedInToday === true
  const enabled = raw.enabled !== false && raw.active !== false
  const credits = raw.credits ?? raw.todayCredit ?? nest.todayPoints ?? 0
  const extra = raw.extraCredits ?? 0
  const streak = raw.streakDays ?? nest.streak ?? 0

  const state = checkedIn ? '<span class="dot ok"></span> 今日已签'
    : (enabled ? '<span class="dot warn"></span> 今日未签' : '<span class="dot off"></span> 活动未开启')
  return `
    <div class="signin-box">
      <div class="row"><span class="k">签到状态</span><span>${state}</span></div>
      <div class="row"><span class="k">获得积分</span><span class="big">${credits}${extra ? ' + ' + extra : ''}${streak ? ' · 连签' + streak : ''}</span></div>
      <div class="row"><span class="k">今日计划时刻</span><span>${esc(s.scheduledAt || '-')}</span></div>
      ${s.lastResult ? `<div class="row"><span class="k">最近结果</span><span class="muted">${esc(s.lastResult)}</span></div>` : ''}
      <div class="row" style="margin-top:8px">
        <span></span>
        <button onclick="claim('${esc(r.id)}')" ${checkedIn ? 'disabled' : ''}>立即签到</button>
      </div>
    </div>`
}

// ---- 派猫猫旅行 ----

/**
 * 把「距到达」渲染成可读时长。
 *
 * 关键：用 arriveAt 与 serverNow 的**差值**算，而不是把 arriveAt 当本机时间戳——
 * 服务端的时间基准未必与浏览器一致。前端只算一次并本地递减（见 tickTravelCountdowns）。
 */
function travelRemaining(a) {
  if (!a.arriveAt || !a.serverNow) return ''
  const sec = a.arriveAt - a.serverNow
  if (sec <= 0) return '已到达'
  const m = Math.ceil(sec / 60)
  if (m < 60) return '剩 ' + m + ' 分钟'
  const h = Math.floor(m / 60)
  const rest = m % 60
  return '剩 ' + h + ' 小时' + (rest ? ' ' + rest + ' 分' : '')
}

/** 四态徽标：旅行中 / 今日已派 / 刚领到 / 无 Buddy。 */
function travelBadge(a) {
  const justClaimed = a.claimedAtMs && (Date.now() - a.claimedAtMs) < 3600_000 && a.claimedCredit > 0
  if (justClaimed) {
    return '<span class="dot ok"></span> 刚领到 +' + a.claimedCredit + ' 积分'
  }
  if (a.state === 'traveling' || a.state === 'arrived') {
    const left = travelRemaining(a)
    return '<span class="dot warn"></span> 旅行中' + (a.locationName ? '·' + esc(a.locationName) : '') +
      (left ? '（' + left + '）' : '')
  }
  if (a.doneReason === 'no-buddy') return '<span class="dot off"></span> 无 Buddy'
  if (a.doneReason === 'window') return '<span class="dot off"></span> 不在可派时段'
  if (a.doneReason === 'claimed') return '<span class="dot ok"></span> 今日已领'
  if (a.doneReason === 'daily-limit') return '<span class="dot ok"></span> 今日已派'
  if (a.done) return '<span class="dot ok"></span> 今日已派'
  return '<span class="dot warn"></span> 待派遣'
}

function travelHtml(r) {
  // workbuddy-proxy 未升级时端点 404，overview 里 travel 为 null → 整块隐藏。
  if (r.travel === null || r.travel === undefined) return ''
  const list = Array.isArray(r.travel.accounts) ? r.travel.accounts : []
  if (list.length === 0) {
    // 该区域没有旅行目标。国际版天生如此（成长中心只有国内版），
    // 显式说明而不是静默隐藏，省掉一个「怎么没有」的疑问。
    // region 由 travel 载荷自带（代理按端口区域过滤后回传），不靠 id 猜。
    const why = r.travel.region === 'global' ? '国际版无此活动' : '暂无国内版账号'
    return '<div class="signin-box"><div class="row"><span class="k">派猫猫旅行</span>' +
      '<span class="muted">' + esc(why) + '</span></div></div>'
  }
  const win = r.travel.window || {}
  // 服务端实测：每账号每天只能派 1 次，领取后不重置。所以「已派/已领」的账号
  // 直接把按钮置灰并说明原因——否则用户点了只会看到「达到上限」，
  // 以为按钮坏了。（每日额度由代理在可派时段内自动用掉，无需手动。）
  const notDispatchable = a => a.done === true || a.state === 'traveling' || a.state === 'arrived'
  const rows = list.map(a => {
    // 把服务端的「差值」换算成本地绝对落地点，之后前端自己递减，无需再问后端。
    const deltaSec = (a.arriveAt && a.serverNow) ? (a.arriveAt - a.serverNow) : 0
    const deadline = deltaSec > 0 ? Date.now() + deltaSec * 1000 : 0
    const off = notDispatchable(a)
    const why = a.doneReason === 'no-buddy' ? '无 Buddy'
      : a.doneReason === 'claimed' ? '今日已领，明日再来'
      : a.doneReason === 'daily-limit' ? '今日已派，明日再来'
      : a.doneReason === 'window' ? '不在可派时段'
      : a.state === 'traveling' || a.state === 'arrived' ? '旅行中'
      : '今日已派'
    return `
    <div class="row">
      <span class="k">${esc(a.label)}</span>
      <span>${travelBadge(a)}</span>
      <span class="muted" data-travel-remain="${deadline}">${a.state === 'traveling' ? travelRemaining(a) : (off ? esc(why) : '')}</span>
      <button onclick="departOne('${esc(r.id)}','${esc(a.id)}')" ${off ? `disabled title="${esc(why)}"` : ''}>立即派遣</button>
    </div>`
  }).join('')
  const anyOff = list.some(notDispatchable)
  return `
    <div class="signin-box">
      <div class="row"><span class="k">可派时段</span><span class="muted">${win.startHour ?? 8}:00–${win.endHour ?? 23}:00 · 每账号每天 1 次，代理自动完成</span></div>
      ${rows}
      <div class="row" style="margin-top:8px">
        <span></span>
        <button class="primary" onclick="departAll('${esc(r.id)}')" ${anyOff ? 'disabled title="部分账号今日已派"' : ''}>全部派遣</button>
      </div>
    </div>`
}

/**
 * 本地递减倒计时：每 30 秒刷新一次显示，不产生任何后端请求。
 * data-travel-remain 存的是「本地绝对落地点」，由渲染时的服务端差值换算而来。
 */
function tickTravelCountdowns() {
  document.querySelectorAll('[data-travel-remain]').forEach(el => {
    const deadline = Number(el.getAttribute('data-travel-remain') || '0')
    if (!deadline) { el.textContent = ''; return }
    const sec = Math.round((deadline - Date.now()) / 1000)
    if (sec <= 0) { el.textContent = '已到达，等待领取'; return }
    const m = Math.ceil(sec / 60)
    el.textContent = m < 60 ? ('剩 ' + m + ' 分钟') : ('剩 ' + Math.floor(m / 60) + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : ''))
  })
}

async function departOne(region, id) {
  try {
    const r = await api('/api/travel/depart', 'POST', { region, id })
    showDepartResults(r, '派遣结果')
  } catch (e) { toast('派遣失败：' + e.message, 'err') }
  await refresh()
}

async function departAll(region) {
  try {
    const r = await api('/api/travel/depart', 'POST', { region })
    showDepartResults(r, '全部派遣结果')
  } catch (e) { toast('派遣失败：' + e.message, 'err') }
  await refresh()
}

function showDepartResults(r, title) {
  if (r && r.status === 409) { toast('已有派遣在处理中，请稍候', 'err'); return }
  const results = r && r.data && r.data.results
  if (!Array.isArray(results)) { toast((r && r.error) || '派遣无返回', 'err'); return }
  const lines = results.map(x => x.label + '：' + x.message)
  const anyOk = results.some(x => x.ok)
  toast(title + '\n' + lines.join('\n'), anyOk ? 'ok' : 'err')
}

function card(r) {
  const a = authOf(r)
  const models = Array.isArray(r.models) ? r.models.length : (r.models ?? '-')
  return `
    <div class="card">
      <h2><span class="dot ${a.cls}"></span> ${esc(r.provider)} <span class="tag">${esc(r.label)}</span></h2>
      <div class="muted" style="margin-bottom:10px">端口 ${r.port}</div>
      <div class="row" ${a.full ? `title="${a.full}"` : ''}><span class="k">账号</span><span>${a.text}</span></div>
      <div class="row"><span class="k">模型数</span><span>${models}</span></div>
      ${signinHtml(r)}
      ${travelHtml(r)}
    </div>`
}

let refreshInFlight = false
/** 上次主面板刷新成功的时间戳；用于切回标签页时的节流判断。 */
let lastRefreshAt = 0

async function refresh() {
  if (!HUB_KEY) { document.getElementById('keyTag').textContent = '缺少 key'; return }
  // 重入保护：定时器 / 切回标签页 / 手动点击可能同时触发，
  // 并发刷新会让 refreshCredits 的追加互相叠加造成卡片重复。
  if (refreshInFlight) return
  refreshInFlight = true
  try {
    const data = await api('/api/overview')
    document.getElementById('keyTag').textContent = '已连接'
    document.getElementById('grid').innerHTML = data.regions.map(card).join('')
    document.getElementById('updated').textContent = '更新于 ' + new Date(data.at).toLocaleTimeString()
    lastRefreshAt = Date.now()
  } catch (e) {
    toast('刷新失败：' + e.message, 'err')
    document.getElementById('keyTag').textContent = '连接失败'
  }
  try {
    await refreshCredits()
  } finally {
    refreshInFlight = false
  }
}

/** WorkBuddy 全部账号积分：总额徽章 + 按国内/国际分组明细（独立请求，失败不影响主面板）。 */
async function refreshCredits() {
  const tag = document.getElementById('creditTag')
  const grid = document.getElementById('creditGrid')
  try {
    const c = await api('/api/workbuddy/credits')
    tag.textContent = '积分 ' + (c.total ?? 0)
    const rowsOf = (entries) => (entries || []).map(e => {
      const who = e.account ? esc(e.account) : '(未识别账号)'
      const val = e.total === undefined
        ? '<span class="muted">' + esc(e.error || '不可用') + '</span>'
        : e.total + ' 分'
      return `<div class="row"><span>${who} <span class="muted">:${e.port}</span></span><b>${val}</b></div>`
    }).join('')
    const groups = c.groups || []
    const sections = groups.map(g => `
        <div class="row" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
          <span class="k">${esc(g.label)}</span><b>${g.total ?? 0} 分</b>
        </div>
        ${rowsOf(g.entries) || '<div class="row muted">无账号</div>'}
    `).join('')
    grid.innerHTML = `
      <div class="card">
        <h2>WorkBuddy 积分 <span class="tag">分区域 · 去重</span></h2>
        <div class="row"><span>合计</span><b>${c.total ?? 0} 分</b></div>
        ${sections || '<div class="row muted">暂无数据</div>'}
        <div class="row"><span class="muted">${c.note ? esc(c.note) + '；' : ''}每次刷新读取实时余额</span></div>
      </div>`
  } catch (e) {
    tag.textContent = '积分 —'
    grid.innerHTML = ''
  }
  // Trae 额度：独立请求，失败不影响 WorkBuddy 卡片
  try {
    const t = await api('/api/trae/credits')
    const num = v => (v === undefined ? '—' : Math.round(v * 100) / 100)
    const pct = t.ratio === undefined ? '' : ` (${(t.ratio * 100).toFixed(1)}%)`
    const traeCard = `
      <div class="card">
        <h2>Trae 额度 <span class="tag">国内 · :${t.port}</span></h2>
        <div class="row"><span>剩余</span><b>${num(t.remaining)} 分</b></div>
        <div class="row"><span>已用 / 总额</span><b>${num(t.consumed)} / ${num(t.total)}${pct}</b></div>
        <div class="row"><span class="muted">${t.error ? esc(t.error) : '来自 /trae/api/v2/pay/ide_user_ent_usage'}</span></div>
      </div>`
    grid.innerHTML += traeCard
  } catch (e) { /* Trae 额度不可用时静默 */ }
}

async function claim(id) {
  try {
    const r = await api('/api/signin/claim', 'POST', { id })
    const msg = r.entry?.result || r.results?.[0]?.message || '已处理'
    toast(id + '：' + msg, 'ok')
    refresh()
  } catch (e) { toast(id + ' 签到失败：' + e.message, 'err') }
}

async function claimAll() {
  try {
    const data = await api('/api/overview')
    // 兼容两种形状：有逐目标明细的（新版 workbuddy-proxy）看 targets 是否全领完；
    // 没有明细的（其它代理 / 旧版）退回单账号 view.checkedIn 判断。
    const ids = data.regions.filter(r => {
      if (!r.signin) return false
      if (Array.isArray(r.signin.targets) && r.signin.targets.length > 0) {
        return r.signin.targets.some(t => !t.claimedToday)
      }
      return !r.signin.error && r.signin.view && !r.signin.view.checkedIn
    }).map(t => t.id)
    if (!ids.length) { toast('没有需要签到的平台'); return }
    for (const id of ids) { await claim(id) }
  } catch (e) { toast('批量签到失败：' + e.message, 'err') }
}

// 自动刷新：15 分钟一次；标签页不可见时暂停，切回时若距上次成功刷新不足
// 60 秒则跳过。面板每次刷新都会向 WorkBuddy/Trae 上游查询余额，降低频率可避免频繁调用。
const REFRESH_MS = 15 * 60 * 1000
const VISIBILITY_MIN_GAP_MS = 60 * 1000
let refreshTimer = null
let countdownTimer = null

function startAutoRefresh() {
  if (refreshTimer !== null) return
  refreshTimer = setInterval(() => { if (!document.hidden) refresh() }, REFRESH_MS)
  // 倒计时纯本地递减，30 秒一次足够，且完全不产生后端请求。
  if (countdownTimer === null) {
    countdownTimer = setInterval(() => { if (!document.hidden) tickTravelCountdowns() }, 30 * 1000)
  }
}

function stopAutoRefresh() {
  if (refreshTimer !== null) { clearInterval(refreshTimer); refreshTimer = null }
  if (countdownTimer !== null) { clearInterval(countdownTimer); countdownTimer = null }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopAutoRefresh(); return }
  startAutoRefresh()
  if (Date.now() - lastRefreshAt >= VISIBILITY_MIN_GAP_MS) refresh()
})

refresh()
startAutoRefresh()
</script>
</body>
</html>
