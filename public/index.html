<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Hub · 本地账号与积分总览</title>
<style>
  :root{
    --bg:#f4f5fa;
    --card:#fff;
    --ink:#1c2333;
    --ink-2:#5a6378;
    --ink-3:#8b93a7;
    --line:#e8eaf2;
    --brand:#4f46e5;
    --brand-2:#7c3aed;
    --green:#047857;
    --green-bg:rgba(16,185,129,.12);
    --green-line:rgba(16,185,129,.35);
    --amber:#b45309;
    --amber-bg:rgba(245,158,11,.14);
    --amber-line:rgba(245,158,11,.4);
    --red:#dc2626;
    --red-bg:rgba(239,68,68,.10);
    --red-line:rgba(239,68,68,.32);
    --radius:16px;
    --shadow:0 1px 2px rgba(28,35,51,.05), 0 6px 24px -8px rgba(28,35,51,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
  button:focus-visible{outline:3px solid rgba(79,70,229,.28);outline-offset:2px;border-radius:8px}
  .muted{color:var(--ink-2);font-size:13px}
  .tiny{color:var(--ink-3);font-size:12px}

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 58%,#9333ea 100%);
    color:#fff;padding:24px 20px 18px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.2px);
    background-size:22px 22px;opacity:.5;
  }
  .hero::after{
    content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none;
  }
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1}
  .hero-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .hero h1{font-size:24px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .hero h1 svg{width:26px;height:26px;flex:none}
  .hero .tagline{opacity:.92;font-size:13.5px;margin-top:4px}
  .hero-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .hbtn{
    display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;
    font-size:13px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    color:#fff;transition:background .18s;
  }
  .hbtn:hover{background:rgba(255,255,255,.26)}
  .hbtn.solid{background:#fff;color:var(--brand);border-color:#fff}
  .hbtn:disabled{opacity:.55;cursor:not-allowed}

  /* 导航：PC 顶部药丸，移动端底部固定栏 */
  .nav{margin-top:16px}
  .nav-inner{display:flex;background:rgba(255,255,255,.16);border-radius:14px;padding:4px;gap:4px;backdrop-filter:blur(4px)}
  .nav button{
    flex:1;min-height:40px;border-radius:11px;font-size:14px;font-weight:600;color:rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;
  }
  .nav button svg{width:16px;height:16px;flex:none}
  .nav button:hover:not(.active){background:rgba(255,255,255,.14)}
  .nav button.active{background:#fff;color:var(--brand);box-shadow:0 2px 10px rgba(20,24,40,.18)}
  .nav .badge{
    min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;
    font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .nav button.active .badge{background:var(--red)}

  /* Hero 芯片：每个平台一颗，兼作快速跳转 */
  .hero-chips{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;
    padding:8px 14px;display:flex;align-items:center;gap:10px;min-width:150px;text-align:left;
    transition:background .18s;
  }
  .chip:hover{background:rgba(255,255,255,.26)}
  .chip .ci{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
  .chip .ci svg{width:16px;height:16px}
  .chip .cn{font-size:12.5px;opacity:.9;line-height:1.3}
  .chip .cv{font-size:15px;font-weight:800;line-height:1.3}
  .chip.alert{background:rgba(220,38,38,.34);border-color:rgba(255,255,255,.5)}

  /* ---------- Layout ---------- */
  main{max-width:1080px;margin:0 auto;padding:16px 20px 96px}
  .tab-panel{display:none;animation:fadeUp .3s ease}
  .tab-panel.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .tab-panel{animation:none}
    *{transition:none!important}
  }

  .card{
    background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:14px;
  }
  .card-title{
    font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .card-title .dot{width:8px;height:8px;border-radius:3px;background:var(--brand);flex:none}
  /* 平台图标只写了 viewBox 没有宽高，不约束的话会撑满整行变成巨型色块。 */
  .card-title > svg{width:17px;height:17px;flex:none}
  .card-title .right{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-3)}
  /* 380px 下限：320px 会排成三列，而卡片里带长原因文案的徽章在那个宽度下必然溢出。 */
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;align-items:start}

  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;align-items:baseline}
  .row .k{color:var(--ink-2);font-size:13.5px;flex:none}
  .row .v{text-align:right;word-break:break-word;min-width:0}
  /* 右列里塞徽章 + 按钮时用，别让按钮被 space-between 甩到最右边。 */
  .row .v.act{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .row.sub{border-top:1px dashed var(--line);margin-top:6px;padding-top:9px}
  .divider{height:1px;background:var(--line);margin:10px 0;border:0}

  /* 状态徽章：三态 */
  .badge{
    display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 10px;border-radius:999px;
    font-size:12.5px;font-weight:700;border:1.5px solid transparent;white-space:nowrap;
  }
  .badge.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
  .badge.ing{background:rgba(99,102,241,.12);color:var(--brand);border-color:rgba(99,102,241,.32)}
  .badge.off{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
  .badge.err{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}

  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
    font-size:12.5px;background:#eef0f8;color:var(--ink-2);border:1px solid var(--line);
  }
  .pill.on{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
  .pill.pause{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}

  /* 需要处理：优先队列 */
  .attention{border:1.5px solid var(--red-line);background:linear-gradient(135deg,#fef2f2,#fff8f8);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .attention.calm{border-color:var(--green-line);background:linear-gradient(135deg,#f0fdf4,#f7fff9)}
  .attention.note{border-color:var(--line);background:#fbfcff}
  .attention.note h3{color:var(--ink-2)}
  .attention.note .att-item{background:#fff}
  .attention.note .why{color:var(--ink-3)}
  .attention h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .attention h3 svg{width:18px;height:18px;flex:none}
  .att-list{display:flex;flex-direction:column;gap:8px}
  .att-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.8);border-radius:12px;padding:9px 13px;font-size:13.5px}
  .att-item .why{color:var(--red);font-size:12.5px;font-weight:600;margin-left:auto;text-align:right;flex:none}

  /* 统计条 */
  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid rgba(28,35,51,.05);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
  .stat b{display:block;font-size:24px;font-weight:800;line-height:1.2;letter-spacing:-.3px}
  .stat span{font-size:12.5px;color:var(--ink-2)}
  .stat.brand b{color:var(--brand)}
  .stat.green b{color:var(--green)}
  .stat.amber b{color:var(--amber)}

  /* 账号列表项。overflow:hidden 是兜底——徽章里的服务端原文可能很长，
     没有它就会横向溢出卡片、压到隔壁卡片上。 */
  .acct-list{display:flex;flex-direction:column;gap:8px}
  .acct{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px solid var(--line);
    border-radius:12px;background:#fbfcff;flex-wrap:wrap;overflow:hidden;
  }
  .acct .nm{font-size:13.5px;font-weight:600;min-width:96px;word-break:break-all}
  .acct .meta{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0}
  /* 徽章默认 nowrap 是为了单行好看，但列表里的文案是服务端原文（可达 60+ 字），
     必须允许折行，否则撑破容器。 */
  .acct .badge{white-space:normal;text-align:left;line-height:1.45}
  .acct .pts{font-size:14px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}

  /* 按钮 */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;
    border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;
    background:#fff;color:var(--ink);transition:background .15s,border-color .15s;
  }
  .btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .btn.brand{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff}
  .btn.brand:hover:not(:disabled){filter:brightness(1.08);color:#fff}
  .btn.sm{min-height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .sect-title{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.4px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
  .sect-title::after{content:"";flex:1;height:1px;background:var(--line)}

  /* Toast */
  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 40px))}
  .toast{
    background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:12px;
    padding:11px 15px;font-size:13.5px;box-shadow:0 10px 30px -8px rgba(28,35,51,.28);white-space:pre-line;
  }
  .toast.err{border-left-color:var(--red)}
  .toast.ok{border-left-color:var(--green)}

  .empty{color:var(--ink-3);font-size:13.5px;padding:10px 0}

  /* 移动端：导航移到底部固定栏 */
  @media(max-width:720px){
    .hero{padding:20px 16px 14px}
    .hero h1{font-size:20px}
    .hero-actions{margin-left:0;width:100%}
    .nav{
      position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;
      background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
      padding:6px 10px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-inner{background:#eef0f8}
    .nav button{color:var(--ink-2);flex-direction:column;gap:2px;font-size:11px;min-height:46px}
    .nav button svg{width:18px;height:18px}
    .nav button.active{color:var(--brand)}
    main{padding-bottom:90px}
    .grid2{grid-template-columns:1fr}
    .chip{min-width:0;flex:1 1 140px}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div>
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
            <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
          </svg>
          Agent Hub
        </h1>
        <p class="tagline">本机代理账号总览 · 登录状态、每日签到、积分与旅行派遣一屏可见</p>
      </div>
      <div class="hero-actions">
        <span id="updated" class="tiny" style="color:rgba(255,255,255,.8)"></span>
        <button class="hbtn" id="btnRefresh" onclick="refresh()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          刷新
        </button>
        <button class="hbtn solid" onclick="claimAll()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          全部签到
        </button>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <div class="nav-inner" role="tablist">
        <button class="active" data-tab="overview" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          总览
        </button>
        <button data-tab="accounts" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          账号
        </button>
        <button data-tab="credits" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.75 1.75 0 0 1 0 3.5h-3a1.75 1.75 0 0 0 0 3.5h4"/></svg>
          积分
        </button>
        <button data-tab="services" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="6" rx="2"/><path d="M6 7v10M18 7v10"/></svg>
          服务
        </button>
      </div>
    </nav>

    <div class="hero-chips" id="heroChips"></div>
  </div>
</header>

<main>
  <section class="tab-panel active" id="panel-overview" role="tabpanel"></section>
  <section class="tab-panel" id="panel-accounts" role="tabpanel"></section>
  <section class="tab-panel" id="panel-credits" role="tabpanel"></section>
  <section class="tab-panel" id="panel-services" role="tabpanel"></section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const LS_KEY = 'agent-hub-key'
let HUB_KEY = localStorage.getItem(LS_KEY) || ''

const urlKey = new URLSearchParams(location.search).get('key')
if (urlKey) {
  HUB_KEY = urlKey
  localStorage.setItem(LS_KEY, urlKey)
  history.replaceState({}, '', location.pathname)
}

function toast(msg, kind = '') {
  const el = document.createElement('div')
  el.className = 'toast ' + kind
  el.textContent = msg
  document.getElementById('toast').appendChild(el)
  setTimeout(() => el.remove(), 6000)
}

/**
 * 从各种形状的错误体里挖出可读文案。
 *
 * 实测这个 API 链路上错误有四种形状，不能只读 data.error：
 *   1) hub 自己拒绝：      { error: '缺少 region' }            → error 是字符串
 *   2) hub 透传上游失败：  { ok:false, status:502, data:{...} } → error 缺失，原因在 data 里
 *   3) 代理的 OpenAI 错误：{ error:{ message, type, code } }   → error 是对象
 *   4) fetchJson 抓取失败：{ ok:false, error:'fetch failed' }   → 又是字符串
 * 只取 data.error 会让用户只看到「HTTP 502」而看不到真实原因。
 */
function errText(d, status) {
  const cands = [
    d && d.error,
    d && d.message,
    d && d.data && d.data.error,
    d && d.data && d.data.message,
    d && d.data && d.data.error && d.data.error.message,
    d && d.results && d.results[0] && d.results[0].message,
  ]
  for (const c of cands) {
    if (typeof c === 'string' && c.trim() !== '') return c
    if (c && typeof c.message === 'string' && c.message.trim() !== '') return c.message
  }
  return 'HTTP ' + status
}

async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization: 'Bearer ' + HUB_KEY, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  })
  if (res.status === 401) throw new Error('面板 key 无效或缺失')
  const data = await res.json().catch(() => null)
  if (!res.ok) throw new Error(errText(data, res.status))
  return data
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

/**
 * 强制转成有限数字再插进 HTML。
 *
 * 面板把上游 JSON 的字段直接拼进 innerHTML，而「看起来是数字」的字段
 * （credits.total、region.port、models…）并没有类型保护：真返回字符串就会
 * 变成可执行标记。统一用 Number() 收敛掉这一整类，比逐处提防可靠。
 */
function n(v, fallback = 0) {
  const x = typeof v === 'number' ? v : Number(v)
  return Number.isFinite(x) ? x : fallback
}

/** 模型数量：数组取长度，数字直接用，其它一律当未知（绝不把原始值塞进 HTML）。 */
function modelCount(models) {
  if (Array.isArray(models)) return models.length
  if (typeof models === 'number' && Number.isFinite(models)) return models
  return '—'
}

/** 错误文案只留首句并限长，避免撑爆卡片；完整内容放 title 里 hover 可看。 */
function brief(msg, max = 60) {
  const s = String(msg)
  const head = s.split(/[；;。]/)[0]
  return head.length > max ? head.slice(0, max) + '…' : head
}

const ICON = {
  ok: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  err: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  off: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>',
  workbuddy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 0 6h-1v4a3 3 0 0 1-6 0v-1H9a3 3 0 0 1 0-6h1V6a4 4 0 0 1 2-3.46"/></svg>',
  trae: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>',
  minimax: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
}

/* ================= 数据 ================= */
let DATA = { overview: null, wbCredits: null, traeCredits: null, services: null, updates: null }

/* ================= 账号状态 ================= */
/**
 * 桌面端「当前登录」槽位。服务端用 id 区分两类目标：
 *   live-cn / live-global      → 桌面端当前登录的那个号
 *   acct:switch:<uuid>         → 账号库里的独立账号
 * 两者在 /signin/status 里混在同一个 targets 数组返回。
 */
function isLiveSlot(t) {
  return typeof t.id === 'string' && t.id.startsWith('live-')
}

/** 服务端已经给过结论（lastResult 非空）——再点也不会变好。 */
function hasVerdict(t) {
  return typeof t.lastResult === 'string' && t.lastResult.trim() !== ''
}

function authOf(r) {
  const a = r.auth || {}
  if (r.running === false) return { kind: 'err', badge: '<span class="badge err">' + ICON.err + '未运行</span>' }
  if (a.state === 'signed-in') return { kind: 'ok', badge: '<span class="badge ok">' + ICON.ok + '已登录</span>', text: a.account || a.uin || '' }
  // 凭据本身不可用，但账号库里有账号正在服务这个区域 —— 那就是**实际能用**。
  // 按用户要求：能正常读取就不强调凭据的事，不报未登录、也不把原因摊开。
  if (r.provider === 'WorkBuddy') {
    const backed = poolBacksRegion(r)
    if (backed > 0) {
      return {
        kind: 'ok',
        badge: '<span class="badge ok">' + ICON.ok + '可用</span>',
        text: '账号库 ' + backed + ' 个账号',
      }
    }
    // 积分数据没取到就无法判断账号库是否在顶替，此时报「未登录」是不负责任的。
    if (DATA.wbCredits === null) {
      return { kind: 'off', badge: '<span class="badge off">' + ICON.off + '状态未知</span>', text: '积分数据暂不可用，无法判断账号库是否已接管' }
    }
  }
  if (a.state === 'expired') return { kind: 'warn', badge: '<span class="badge off">' + ICON.warn + 'token 过期</span>', text: brief(a.message || ''), full: a.message || '' }
  if (a.state === 'signed-out') return { kind: 'off', badge: '<span class="badge off">' + ICON.off + '未登录</span>' }
  if (a.state === 'no-key') return { kind: 'warn', badge: '<span class="badge off">' + ICON.warn + '缺 key</span>' }
  const msg = a.message || a.state || '未知'
  return { kind: 'err', badge: '<span class="badge err">' + ICON.err + '异常</span>', text: brief(msg), full: msg }
}

/**
 * 签到进度。
 *
 * WorkBuddy 的 /signin/status 带 targets[]（逐账号明细），Trae / MiniMax 只有
 * 一个聚合的 view（legacy 形状）。两条路径统一成同一形状：**targets 恒为数组**。
 * 之前 legacy 分支不返回 targets，collectAttention 里 `si.targets.filter(...)`
 * 就把整个总览页炸成空白——4 个区域命中，而页面只剩 Hero 看起来像加载失败。
 */
function signinStats(r) {
  const s = r.signin
  if (!s) return null
  const raw = Array.isArray(s.targets) ? s.targets : []
  // 桌面端「当前登录」槽位（id 形如 live-cn / live-global）不是账号库里可独立
  // 签到的账号：要么已被同身份账号顶替，要么该账号压根没开签到活动。
  // 服务端一旦对它给出结论（lastResult 非空）就整条去掉，不再在面板上占位——
  // 否则每天都会显示「失败：登录态 token 已加密…」，而这恰恰是**不影响使用**的事。
  // 还没试过的（lastResult 为空）仍然保留，万一它真能领，漏掉才是问题。
  const targets = raw.filter(t => !isLiveSlot(t) || !hasVerdict(t))
  if (targets.length > 0) {
    const done = targets.filter(t => t.claimedToday).length
    return { done, total: targets.length, targets }
  }
  const v = s.view || {}
  // 权威字段是顶层的 claimedToday，不是 view.checkedIn。
  // 实测 4 个 legacy 区域里 view.checkedIn 错 3 个：
  // minimax-cn 今天已签到 +1000 分，view 里却没有 checkedIn；
  // trae-ai 的 view.enabled=false、view.checkedIn=false，但它压根不支持签到。
  const claimed = s.claimedToday === true || v.checkedIn === true
  // 「不签到」有两种完全不同的含义，措辞不能混：
  //   - trae-ai 的「国际区暂不支持自动签到」→ **区域级**：这个区压根不支持
  //   - workbuddy-global 的「签到活动未开启」→ **账号级**：这个号没开签到活动
  // 都说成「该区不签到」会让人以为要去换账号，实际什么都不用做。
  // （原判断用 indexOf('不支持') === 0，而实际文案是「国际区暂不支持…」开头，
  //   根本匹配不上，只是碰巧被 v.enabled === false 兜住了。）
  const msg = typeof s.lastResult === 'string' ? s.lastResult : ''
  const regionLevel = msg.includes('不支持')
  const unsupported = v.enabled === false || regionLevel
  return {
    done: claimed ? 1 : 0,
    total: 1,
    targets: [],
    legacy: { checked: claimed, unsupported, unsupportedLabel: regionLevel ? '该区不签到' : '该账号未开启签到', v },
  }
}

function travelStats(r) {
  const t = r.travel
  if (!t) return null
  const list = Array.isArray(t.accounts) ? t.accounts : []
  return {
    list, count: list.length,
    enabled: t.dispatchEnabled !== false,
    window: t.window || {},
    traveling: list.filter(a => a.state === 'traveling' || a.state === 'arrived').length,
    noBuddy: list.filter(a => a.doneReason === 'no-buddy').length,
  }
}

function travelBadge(a) {
  const justClaimed = a.claimedAtMs && (Date.now() - a.claimedAtMs) < 3600e3 && a.claimedCredit > 0
  if (justClaimed) return '<span class="badge ok">' + ICON.ok + '刚领 +' + n(a.claimedCredit) + '</span>'
  if (a.state === 'traveling' || a.state === 'arrived') {
    return '<span class="badge ing">旅行中' + (a.locationName ? '·' + esc(a.locationName) : '') + '</span>'
  }
  if (a.doneReason === 'no-buddy') return '<span class="badge off">无 Buddy</span>'
  if (a.doneReason === 'window') return '<span class="badge off">不在可派时段</span>'
  if (a.doneReason === 'paused') return '<span class="badge off">已暂停</span>'
  if (a.doneReason === 'claimed') return '<span class="badge ok">今日已领</span>'
  if (a.doneReason === 'daily-limit' || a.done) return '<span class="badge ok">今日已派</span>'
  return '<span class="badge ing">待派遣</span>'
}

function travelRemaining(a) {
  if (!a.arriveAt || !a.serverNow) return ''
  const sec = a.arriveAt - a.serverNow
  if (sec <= 0) return '已到达'
  const m = Math.ceil(sec / 60)
  if (m < 60) return '剩 ' + m + ' 分钟'
  const h = Math.floor(m / 60), rest = m % 60
  return '剩 ' + h + ' 小时' + (rest ? ' ' + rest + ' 分' : '')
}

/**
 * 汇总一批区域的签到目标，**按 label 去重**。
 *
 * workbuddy-cn 与 workbuddy-global 两个端口返回的是同一份 targets
 * （服务端没按区域过滤，travel 那边是过滤了的），不去重就会把 6 个账号数成 12 个。
 */
function uniqueTargets(regions) {
  const seen = new Set()
  const out = []
  for (const r of regions) {
    for (const t of (signinStats(r)?.targets || [])) {
      if (seen.has(t.label)) continue
      seen.add(t.label)
      out.push(t)
    }
  }
  return out
}

/** 签到进度的单元格文案：有 targets 走计数，没有（legacy 区域）走状态描述。 */
function signinCell(regions) {
  const tg = uniqueTargets(regions)
  if (tg.length) {
    const done = tg.filter(t => t.claimedToday).length
    const blocked = tg.filter(isBlocked).length
    return '<b class="num">' + done + ' / ' + tg.length + '</b>'
      + (blocked ? ' <span class="tiny">· ' + blocked + ' 受阻</span>' : '')
  }
  const legacy = regions.map(signinStats).find(s => s && s.legacy)
  if (!legacy) return '<span class="tiny">—</span>'
  if (legacy.legacy.unsupported) return '<span class="tiny">该区不适用</span>'
  return legacy.done
    ? '<span class="badge ok">' + ICON.ok + '今日已签</span>'
    : '<span class="badge off">' + ICON.warn + '未签到</span>'
}

/* ================= 总览 ================= */
/**
 * 该区域在账号库里是否还有能用的账号。
 *
 * 有 = 桌面端登录态虽然不可用，但已经被同身份账号顶上去了，
 * 因此**不该算成待办**，否则面板会为一件已自动处理的事永远亮红灯。
 */
function poolBacksRegion(r) {
  // 账号池是 WorkBuddy 独有的；Trae / MiniMax 的 region 恰好也叫 cn，
  // 不限定 provider 的话 minimax-cn 会误判成「已被账号库接管」。
  if (r.provider !== 'WorkBuddy') return 0
  // region 在 auth 里，不在区域对象顶层（实测顶层字段里没有它）。
  const region = r.auth && r.auth.region
  if (!region) return 0
  const entries = (DATA.wbCredits?.groups || []).find(g => g.region === region)?.entries || []
  return entries.filter(e => typeof e.total === 'number').length
}

/** 未领取且服务端已给出结论的目标——再点也不会变好，只能作为说明展示。 */
function isBlocked(t) {
  return t.claimedToday !== true && hasVerdict(t)
}

/**
 * 需要处理 / 已知情况。
 *
 * level 'todo' = 运营者现在能做点什么；level 'note' = 已经清楚、但没有可执行动作。
 * 混在一起报是这版面板最大的坑：桌面端自 2026-09 起把 token 加密，
 * cn 端口的 live 登录态**永久** signed-out，且剩余 2 个签到目标永远领不到
 * （一个 token 加密、一个「签到活动未开启」）。当成待办就成了每天刷新的假警报。
 */
function collectAttention() {
  const todo = []
  const note = []
  const seen = new Set()
  for (const r of (DATA.overview?.regions || [])) {
    const a = authOf(r)
    const who = r.provider + ' ' + r.label

    if (a.kind === 'err') {
      todo.push({ provider: r.provider, why: '异常', text: who + '：' + (a.full || a.text || '状态未知') })
      continue
    }
    if (a.kind === 'warn' || a.kind === 'off') {
      const backed = poolBacksRegion(r)
      if (backed > 0) {
        note.push({ provider: r.provider, why: '已自动接管', text: who + '：桌面端凭据不可用，账号库中 ' + backed + ' 个账号正在服务该区域' })
      } else {
        todo.push({ provider: r.provider, why: a.kind === 'warn' ? '凭据过期' : '未登录', text: who + '：需要你在桌面端登录后才会恢复' })
      }
      // 凭据不可用时签到必然失败，那是上面这条的连带结果，不重复报。
      continue
    }

    const si = signinStats(r)
    if (!si || si.total === 0 || si.done >= si.total) continue
    // cn / global 两个端口返回的是同一份 targets（服务端未按区域过滤），
    // 不去重的话「待签到 2/6」会一字不差地报两遍。
    const key = si.legacy ? 'L:' + r.id : si.targets.map(t => t.label).join('|')
    if (seen.has(key)) continue
    seen.add(key)

    if (si.legacy) {
      const msg = (r.signin?.lastResult || '').split('；')[0]
      ;(si.legacy.unsupported ? note : todo).push({
        provider: r.provider,
        why: '待签到',
        text: who + (msg ? '：' + msg : ''),
      })
      continue
    }
    const open = si.targets.filter(t => !t.claimedToday && !isBlocked(t))
    const blocked = si.targets.filter(t => isBlocked(t))
    if (open.length) {
      todo.push({
        provider: r.provider,
        why: '待签到 ' + (si.total - si.done - blocked.length) + '/' + si.total,
        text: open.slice(0, 3).map(t => t.label).join('、') + (open.length > 3 ? ' 等 ' + open.length + ' 个' : ''),
      })
    }
    if (blocked.length) {
      note.push({
        provider: r.provider,
        why: '受阻 ' + blocked.length + ' 个',
        text: blocked.map(t => t.label + '（' + brief(t.lastResult, 30) + '）').join('、'),
      })
    }
  }
  return { todo, note }
}

function renderHeroChips() {
  const box = document.getElementById('heroChips')
  if (!DATA.overview) { box.innerHTML = ''; return }
  const regions = DATA.overview.regions || []
  const byProvider = {}
  for (const r of regions) {
    const p = r.provider
    if (!byProvider[p]) byProvider[p] = { provider: p, list: [] }
    byProvider[p].list.push(r)
  }
  const running = regions.filter(r => r.running !== false).length
  const totalCredits = DATA.wbCredits ? n(DATA.wbCredits.total) : undefined
  // 只有「你确实该动手」的才标红。凭据不可用但账号库已顶替属于已知情况，
  // 若也算进去，三个平台会永远全红，等于没有告警。
  const todoProviders = new Set(collectAttention().todo.map(x => x.provider))

  let html = ''
  for (const [p, g] of Object.entries(byProvider)) {
    const ok = g.list.filter(r => (authOf(r).kind === 'ok')).length
    const icon = p === 'WorkBuddy' ? ICON.workbuddy : p === 'Trae' ? ICON.trae : ICON.minimax
    // 大数字已经占了 ok/len，副标题就别再重复一遍（曾显示成「1/2 1/2 就绪」）。
    const sub = ok === g.list.length ? '全部就绪' : (g.list.length - ok) + ' 个未就绪'
    html += `<button class="chip${todoProviders.has(p) ? ' alert' : ''}" onclick="goTab('accounts')">
      <span class="ci">${icon}</span>
      <span><span class="cn">${esc(p)} · ${esc(g.list.map(r => r.label).join('/'))}</span><br><span class="cv num">${ok}/${g.list.length}</span> <span class="cn">${esc(sub)}</span></span>
    </button>`
  }
  html += `<button class="chip" onclick="goTab('credits')">
    <span class="ci">${ICON.ok}</span>
    <span><span class="cn">WorkBuddy 积分</span><br><span class="cv num">${totalCredits === undefined ? '—' : totalCredits}</span> <span class="cn">分</span></span>
  </button>`
  html += `<button class="chip" onclick="goTab('services')">
    <span class="ci">${ICON.trae}</span>
    <span><span class="cn">本地服务</span><br><span class="cv num">${running}/${regions.length}</span> <span class="cn">运行中</span></span>
  </button>`
  box.innerHTML = html
}

function renderOverview() {
  const box = document.getElementById('panel-overview')
  const regions = DATA.overview?.regions || []
  const { todo, note } = collectAttention()

  // 统计条。签到只把「没领且未被卡住」的算作待办，被卡的另计——
  // 否则会长期显示 4/6 让人以为漏签了，其实那 2 个永远领不到。
  const allTargets = uniqueTargets(regions)
  const signedTargets = allTargets.filter(t => t.claimedToday).length
  const blockedTargets = allTargets.filter(isBlocked).length
  const travelAll = regions.map(travelStats).filter(Boolean)
  const travelTotal = travelAll.reduce((n, t) => n + t.count, 0)
  const traveling = travelAll.reduce((n, t) => n + t.traveling, 0)
  const dispatchOn = travelAll.some(t => t.count > 0) ? travelAll[0].enabled : true

  let html = `<div class="stat-strip">
    <div class="stat brand"><b class="num">${DATA.wbCredits ? n(DATA.wbCredits.total) : '—'}</b><span>WorkBuddy 积分</span></div>
    <div class="stat ${blockedTargets ? 'amber' : 'green'}"><b class="num">${allTargets.length ? signedTargets + '/' + allTargets.length : '—'}</b><span>今日签到${blockedTargets ? ' · ' + blockedTargets + ' 受阻' : ''}</span></div>
    <div class="stat"><b class="num">${travelTotal ? traveling + '/' + travelTotal : '—'}</b><span>旅行中</span></div>
    <div class="stat ${dispatchOn ? '' : 'amber'}"><b class="num">${dispatchOn ? '开启' : '暂停'}</b><span>自动派遣</span></div>
  </div>`

  // 需要处理 / 已知情况
  if (todo.length === 0) {
    html += `<div class="attention calm">
      <h3>${ICON.check}没有需要你处理的事</h3>
      <div class="muted">所有凭据可用的账号都已登录，今日签到已领，派遣循环运行中。</div>
    </div>`
  } else {
    html += `<div class="attention">
      <h3>${ICON.bell}需要处理（${todo.length}）</h3>
      <div class="att-list">
        ${todo.map(a => `<div class="att-item"><span>${esc(a.text)}</span><span class="why">${esc(a.why)}</span></div>`).join('')}
      </div>
    </div>`
  }
  if (note.length) {
    html += `<div class="attention note">
      <h3>${ICON.off}已知情况（${note.length}，无需操作）</h3>
      <div class="att-list">
        ${note.map(a => `<div class="att-item"><span>${esc(a.text)}</span><span class="why">${esc(a.why)}</span></div>`).join('')}
      </div>
    </div>`
  }

  // 平台卡片
  html += '<div class="sect-title">平台状态</div><div class="grid2">'
  const byProvider = {}
  for (const r of regions) { (byProvider[r.provider] ??= []).push(r) }
  for (const [p, list] of Object.entries(byProvider)) {
    const icon = p === 'WorkBuddy' ? ICON.workbuddy : p === 'Trae' ? ICON.trae : ICON.minimax
    const tv = list.map(travelStats).find(t => t && t.count > 0)
    html += `<div class="card">
      <div class="card-title">${icon}${esc(p)}<span class="right">${list.length} 个区域</span></div>
      ${list.map(r => {
        const a = authOf(r)
        const models = Array.isArray(r.models) ? r.models.length : (r.models ?? '—')
        return `<div class="row"><span class="k">${esc(r.label)} <span class="tiny">:${n(r.port)}</span></span>
          <span class="v">${a.badge} <span class="tiny num">${modelCount(models)} 模型</span></span></div>`
      }).join('')}
      <div class="row sub"><span class="k">今日签到</span><span class="v">${signinCell(list)}</span></div>
      ${tv ? `<div class="row"><span class="k">旅行</span><span class="v"><span class="pill ${tv.enabled ? 'on' : 'pause'}">${tv.enabled ? '自动派遣开启' : '已暂停'}</span></span></div>` : ''}
    </div>`
  }
  html += '</div>'
  box.innerHTML = html
}

/* ================= 账号 ================= */
function signinHtml(r) {
  const si = signinStats(r)
  if (!si) return ''
  const s = r.signin
  if (si.legacy) {
    const v = si.legacy.v
    const enabled = v.enabled !== false && v.active !== false
    const credits = v.credits ?? v.todayCredit ?? 0
    const streak = v.streakDays ?? 0
    // 「不支持」要排在「已签」前面：trae-ai 的 claimedToday 为 true，
    // 但那是「国际区暂不支持自动签到」的空结果，说成今日已签是误导。
    const badge = si.legacy.unsupported
      ? '<span class="badge off" title="' + esc(s.lastResult || '') + '">' + ICON.off + esc(si.legacy.unsupportedLabel) + '</span>'
      : si.legacy.checked
        ? '<span class="badge ok">' + ICON.ok + '今日已签</span>'
        : (enabled ? '<span class="badge ing">今日未签</span>' : '<span class="badge off">活动未开启</span>')
    const btnDisabled = si.legacy.unsupported || si.legacy.checked
    return `<div class="divider"></div>
      <div class="row"><span class="k">签到</span><span class="v">${badge}</span></div>
      <div class="row"><span class="k">获得积分</span><span class="v num">${n(credits)}${n(streak) ? ' · 连签 ' + n(streak) : ''}</span></div>
      <div class="row"><span class="k">计划时刻</span><span class="v num">${esc(s.scheduledAt || '—')}</span></div>
      ${s.lastResult ? `<div class="row"><span class="k">最近结果</span><span class="v muted">${esc(brief(s.lastResult, 40))}</span></div>` : ''}
      <div class="btn-row" style="margin-top:10px"><button class="btn sm brand" data-act="claim" data-region="${esc(r.id)}" ${
        btnDisabled ? 'disabled title="' + (si.legacy.unsupported ? esc(si.legacy.unsupportedLabel) : '今日已领取') + '"' : ''
      }>立即签到</button></div>`
  }
  const allDone = si.done >= si.total
  // 全部未领目标都已被服务端判定（token 加密 / 活动未开启）时按钮置灰：
  // 这时点下去必然拿不到积分，却会让人以为操作失败了。
  const openable = si.legacy ? !si.legacy.unsupported : si.targets.some(t => !t.claimedToday && !isBlocked(t))
  const signinBtn = `<div class="btn-row" style="margin-top:10px"><button class="btn sm brand" data-act="claim" data-region="${esc(r.id)}" ${
    allDone || !openable ? 'disabled title="' + (allDone ? '今日已全部领取' : '剩余目标均无法领取（见上方原因）') + '"' : ''
  }>立即签到</button></div>`
  return `<div class="divider"></div>
    <div class="row"><span class="k">今日签到</span><span class="v"><b class="num">${si.done} / ${si.total}</b></span></div>
    <div class="acct-list" style="margin-top:8px">
      ${si.targets.map(t => {
        const blocked = isBlocked(t)
        const cell = t.claimedToday
          ? '<span class="badge ok">' + ICON.ok + esc(brief(t.lastResult || '已领取', 26)) + '</span>'
          : blocked
            // 未领但服务端已给结论：说明原因，而不是显示一个「待签到」让人干等
            ? '<span class="badge off" title="' + esc(t.lastResult) + '">' + ICON.warn + esc(brief(t.lastResult, 26)) + '</span>'
            : '<span class="tiny num">计划 ' + esc(t.scheduledAt || '—') + '</span>'
        return `<div class="acct">
        <span class="nm">${esc(t.label)}</span>
        <span class="meta">${cell}</span>
      </div>`
      }).join('')}
    </div>
    ${signinBtn}`
}

function travelHtml(r) {
  const t = travelStats(r)
  if (!t) return ''
  if (t.count === 0) {
    const why = (DATA.overview?.regions.find(x => x.id === r.id)?.travel?.region === 'global') ? '国际版无此活动' : '暂无国内版账号'
    return `<div class="divider"></div><div class="row"><span class="k">派猫猫旅行</span><span class="v muted">${esc(why)}</span></div>`
  }
  const notDispatchable = a => a.done === true || a.state === 'traveling' || a.state === 'arrived'
  const anyOff = t.list.some(notDispatchable)
  const w = t.window
  return `<div class="divider"></div>
    <div class="row">
      <span class="k">自动派遣</span>
      <span class="v act"><span class="pill ${t.enabled ? 'on' : 'pause'}">${t.enabled ? '已开启' : '已暂停（在途仍领取）'}</span>
      <button class="btn sm" id="tg-${esc(r.id)}" data-act="dispatch" data-region="${esc(r.id)}" data-on="${t.enabled ? 'false' : 'true'}">${t.enabled ? '暂停' : '开启'}</button></span>
    </div>
    <div class="row"><span class="k">可派时段</span><span class="v tiny num">${n(w.startHour, 8)}:00–${n(w.endHour, 23)}:00 · 每账号每天 1 次</span></div>
    <div class="acct-list" style="margin-top:8px">
      ${t.list.map(a => {
        const off = notDispatchable(a)
        const why = a.doneReason === 'no-buddy' ? '无 Buddy'
          : a.doneReason === 'claimed' ? '今日已领，明日再来'
          : a.doneReason === 'daily-limit' ? '今日已派，明日再来'
          : a.doneReason === 'paused' ? '已暂停'
          : a.doneReason === 'window' ? '不在可派时段'
          : (a.state === 'traveling' || a.state === 'arrived') ? '旅行中' : '今日已派'
        return `<div class="acct">
          <span class="nm">${esc(a.label)}</span>
          <span class="meta">${travelBadge(a)} <span class="tiny" data-travel-remain="${(a.arriveAt && a.serverNow && a.arriveAt > a.serverNow) ? Date.now() + (a.arriveAt - a.serverNow) * 1000 : 0}">${a.state === 'traveling' ? travelRemaining(a) : (off ? esc(why) : '')}</span></span>
          <button class="btn sm" data-act="depart" data-region="${esc(r.id)}" data-id="${esc(a.id)}" ${off ? `disabled title="${esc(why)}"` : ''}>派遣</button>
        </div>`
      }).join('')}
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn sm brand" data-act="depart-all" data-region="${esc(r.id)}" ${anyOff || !t.enabled ? 'disabled title="部分账号今日已派，或自动派遣已暂停"' : ''}>全部派遣</button>
    </div>`
}

function accountCard(r) {
  const a = authOf(r)
  const models = Array.isArray(r.models) ? r.models.length : (r.models ?? '—')
  return `<div class="card">
    <div class="card-title">${a.badge}${esc(r.provider)} <span class="pill">${esc(r.label)}</span><span class="right num">:${n(r.port)}</span></div>
    ${a.text ? `<div class="row" ${a.full ? `title="${esc(a.full)}"` : ''}><span class="k">账号</span><span class="v">${esc(a.text)}</span></div>` : ''}
    <div class="row"><span class="k">可用模型</span><span class="v num">${modelCount(models)}</span></div>
    ${signinHtml(r)}
    ${travelHtml(r)}
  </div>`
}

function renderAccounts() {
  const regions = DATA.overview?.regions || []
  // 两列网格：单列时 6 张区域卡在 1440 宽下每张都摊满整行，读起来全是横向长条。
  document.getElementById('panel-accounts').innerHTML =
    (regions.length
      ? '<div class="grid2">' + regions.map(accountCard).join('') + '</div>'
      : '<div class="card"><div class="empty">暂无数据</div></div>')
}

/* ================= 积分 ================= */
function renderCredits() {
  const box = document.getElementById('panel-credits')
  let html = ''

  // WorkBuddy
  if (DATA.wbCredits) {
    const c = DATA.wbCredits
    html += `<div class="card">
      <div class="card-title"><span class="dot"></span>WorkBuddy 积分<span class="right">分区域 · 去重</span></div>
      <div class="row"><span class="k">合计</span><span class="v"><b class="num" style="font-size:22px;color:var(--brand)">${n(c.total)} 分</b></span></div>
    `
    for (const g of (c.groups || [])) {
      html += `<div class="sect-title">${esc(g.label)}<span class="num">${n(g.total)} 分</span></div>
        <div class="acct-list">
          ${(g.entries || []).map(e => `<div class="acct">
            <span class="nm">${esc(e.account || e.label || '(未识别)')}</span>
            <span class="meta tiny">:${n(e.port)}${n(e.packages) ? ' · ' + n(e.packages) + ' 个额度包' : ''}</span>
            <span class="pts num">${e.total === undefined ? '<span class="tiny" title="' + esc(e.error || '') + '">不可用</span>' : n(e.total) + ' 分'}</span>
          </div>`).join('')}
        </div>`
    }
    if (!(c.groups || []).length) html += '<div class="empty">暂无账号</div>'
    html += `<div class="row sub"><span class="k">数据来源</span><span class="v tiny">${esc(c.note || '每次刷新读取实时余额')}</span></div></div>`
  } else {
    html += '<div class="card"><div class="empty">WorkBuddy 积分暂不可用</div></div>'
  }

  // Trae
  if (DATA.traeCredits) {
    const t = DATA.traeCredits
    const num = v => (v === undefined ? '—' : Math.round(v * 100) / 100)
    const pct = t.ratio === undefined ? 0 : t.ratio
    const color = pct > 0.9 ? 'var(--red)' : pct > 0.7 ? 'var(--amber)' : 'var(--green)'
    html += `<div class="card">
      <div class="card-title"><span class="dot" style="background:var(--brand-2)"></span>Trae 额度<span class="right num">国内 · :${n(t.port)}</span></div>
      <div class="row"><span class="k">剩余</span><span class="v"><b class="num" style="font-size:22px">${num(t.remaining)} 分</b></span></div>
      <div class="row"><span class="k">已用 / 总额</span><span class="v num">${num(t.consumed)} / ${num(t.total)}（${(pct * 100).toFixed(1)}%）</span></div>
      <div style="height:8px;border-radius:6px;background:#eef0f8;overflow:hidden;margin-top:8px">
        <div style="height:100%;width:${Math.min(100, pct * 100).toFixed(1)}%;background:${color};border-radius:6px"></div>
      </div>
      <div class="row sub"><span class="k">来源</span><span class="v tiny">${esc(t.error || '/trae/api/v2/pay/ide_user_ent_usage')}</span></div>
    </div>`
  }

  box.innerHTML = html
}

/* ================= 服务 ================= */
/**
 * 版本检查是唯一要访问外网的部分（GitHub 上三个仓库的 latest tag）。
 * 放进主刷新会让每 15 分钟的轮询都出网，徒增延迟和被限流的可能，
 * 所以只在切到「服务」页时按需拉，并缓存 30 分钟。
 */
const UPDATE_TTL_MS = 30 * 60 * 1000
let updatesAt = 0
let updatesInFlight = false

async function loadUpdates(force) {
  if (updatesInFlight) return
  if (!force && DATA.updates && Date.now() - updatesAt < UPDATE_TTL_MS) return
  updatesInFlight = true
  renderServices()
  try {
    DATA.updates = await api('/api/update/check')
    updatesAt = Date.now()
  } catch (e) {
    DATA.updates = null
    toast('版本检查失败：' + e.message, 'err')
  } finally {
    updatesInFlight = false
    renderServices()
  }
}

function renderServices() {
  const box = document.getElementById('panel-services')
  const svcs = DATA.services?.services || []
  const ups = DATA.updates?.repos || []
  const upCount = ups.filter(u => u.hasUpdate).length

  let html = `<div class="card">
    <div class="card-title"><span class="dot"></span>本地服务<span class="right">${svcs.filter(s => s.running).length}/${svcs.length} 运行中</span></div>
    <div class="acct-list">
      ${svcs.map(s => `<div class="acct">
        <span class="nm">${esc(s.id)}</span>
        <span class="meta tiny num">127.0.0.1:${n(s.port)}</span>
        <span class="v">${s.running ? '<span class="badge ok">' + ICON.ok + '运行中</span>' : '<span class="badge err">' + ICON.err + '未运行</span>'}</span>
      </div>`).join('') || '<div class="empty">暂无数据</div>'}
    </div>
  </div>`

  html += `<div class="card">
    <div class="card-title"><span class="dot" style="background:${ups.length ? (upCount ? 'var(--amber)' : 'var(--green)') : 'var(--ink-3)'}"></span>版本<span class="right">${ups.length ? (upCount ? upCount + ' 个可更新' : '全部最新') : (updatesInFlight ? '检查中…' : '未检查')}</span></div>
    ${ups.length ? `<div class="acct-list">
      ${ups.map(u => `<div class="acct">
        <span class="nm">${esc(u.name)}</span>
        <span class="meta tiny num">本地 ${esc(u.current)} → 最新 ${esc(u.latest)}</span>
        <span class="v">${u.hasUpdate
          ? '<span class="badge off">' + ICON.warn + '可更新</span>'
          : '<span class="badge ok">' + ICON.ok + '最新</span>'}</span>
      </div>`).join('')}
    </div>` : '<div class="empty">进入本页时会自动向 GitHub 查询各仓最新版本。</div>'}
    <div class="row sub"><span class="k">更新方式</span><span class="v tiny">更新会改动本机代码，不在面板上一键执行；需要时用 <code>POST /api/update/apply</code> 并带 <code>{"confirm":"apply"}</code></span></div>
  </div>`

  box.innerHTML = html
}

/* ================= 渲染总入口 ================= */
function renderAll() {
  renderHeroChips()
  renderOverview()
  renderAccounts()
  renderCredits()
  renderServices()
}

/** 旅行倒计时：纯本地递减，30 秒一次，零后端请求。 */
function tickTravelCountdowns() {
  document.querySelectorAll('[data-travel-remain]').forEach(el => {
    const deadline = Number(el.getAttribute('data-travel-remain') || '0')
    if (!deadline) return
    const sec = Math.round((deadline - Date.now()) / 1000)
    if (sec <= 0) { el.textContent = '已到达，等待领取'; return }
    const m = Math.ceil(sec / 60)
    el.textContent = m < 60 ? ('剩 ' + m + ' 分钟') : ('剩 ' + Math.floor(m / 60) + ' 小时' + (m % 60 ? ' ' + (m % 60) + ' 分' : ''))
  })
}

function goTab(name) {
  document.querySelectorAll('.nav button').forEach(b => {
    const on = b.dataset.tab === name
    b.classList.toggle('active', on)
    b.setAttribute('aria-selected', on ? 'true' : 'false')
  })
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === 'panel-' + name)
  })
  window.scrollTo({ top: 0, behavior: 'instant' })
  // 唯一要出网的版本检查，只在真正看到那一页时才发生
  if (name === 'services') void loadUpdates(false)
}
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => goTab(b.dataset.tab)))

/**
 * 账号区按钮的事件委托。
 *
 * 之前这些按钮用 inline `onclick="departOne('${esc(a.id)}')"`。
 * 那个写法是**真的无效**：HTML 解析器会先把属性值里的 `&#39;` 还原成 `'`，
 * JS 引擎拿到的已经是带裸引号的源码，esc() 等于没做——只要账号 id 里出现
 * 一个单引号就能跳出字符串字面量。而账号 id 来自 `state/accounts.json`
 * 的 `key` 字段，那里只校验了 `typeof === 'string'`（该文件的设计用途就是
 * 兼容导入 wb-switch 的账号库）。
 *
 * 改用 data-* 属性后，esc() 处在它本该在的**属性上下文**里，语义正确；
 * 顺带也不再往 HTML 里插 JS 源码。
 */
document.addEventListener('click', ev => {
  const btn = ev.target instanceof Element ? ev.target.closest('[data-act]') : null
  if (!btn || btn.disabled) return
  const region = btn.getAttribute('data-region') || ''
  switch (btn.getAttribute('data-act')) {
    case 'claim': void claimOne(region); break
    case 'dispatch': void setDispatch(region, btn.getAttribute('data-on') === 'true'); break
    case 'depart': void departOne(region, btn.getAttribute('data-id') || ''); break
    case 'depart-all': void departAll(region); break
  }
})

/* ================= 数据拉取 ================= */
let refreshInFlight = false
let lastRefreshAt = 0

async function refresh() {
  if (!HUB_KEY) { toast('缺少面板 key', 'err'); return }
  if (refreshInFlight) return
  refreshInFlight = true
  const btn = document.getElementById('btnRefresh')
  if (btn) btn.disabled = true
  try {
    const data = await api('/api/overview')
    DATA.overview = data
    document.getElementById('updated').textContent = '更新于 ' + new Date(data.at).toLocaleTimeString()
    lastRefreshAt = Date.now()
  } catch (e) {
    toast('刷新失败：' + e.message, 'err')
  }
  // 以下各自独立失败，互不影响
  await Promise.allSettled([
    api('/api/workbuddy/credits').then(d => { DATA.wbCredits = d }).catch(() => { DATA.wbCredits = null }),
    api('/api/trae/credits').then(d => { DATA.traeCredits = d }).catch(() => { DATA.traeCredits = null }),
    api('/api/services').then(d => { DATA.services = d }).catch(() => { DATA.services = null }),
  ])
  renderAll()
  refreshInFlight = false
  if (btn) btn.disabled = false
}

/* ================= 操作 ================= */

/**
 * 立即签到。
 *
 * hub 的 /api/signin/claim 返回 { ok, status, data }，真正的业务结果在 data 里：
 * 代理成功时给 { runtime, label, region, ok, message }；
 * 本端口凭据不可用时会退回「领取该区域所有未领账号」，给 { message, results[] }。
 * 注意 results 挂在 data 上，不是顶层——之前按顶层读会永远显示「已处理」。
 */
async function claim(id) {
  const r = await api('/api/signin/claim', 'POST', { id })
  const d = (r && r.data) || {}
  const lines = []
  if (d.message) lines.push(d.message)
  if (Array.isArray(d.results) && d.results.length) {
    lines.push(...d.results.map(x => x.label + '：' + (x.message || (x.ok ? '已领取' : '失败'))))
  }
  return { ok: r.ok !== false && d.ok !== false, text: lines.join('\n') || '已处理' }
}

/**
 * 值得点「全部签到」的区域。
 *
 * 只收**还有可领目标**的区域：服务端已给出结论的受阻目标（token 加密、
 * 活动未开启）再点一次结果不会变，白跑一趟上游还会让面板误以为有进展。
 */
function pendingRegionIds() {
  return (DATA.overview?.regions || []).filter(r => {
    const si = signinStats(r)
    if (!si || si.total === 0 || si.done >= si.total) return false
    return si.legacy ? !si.legacy.unsupported : si.targets.some(t => !t.claimedToday && !isBlocked(t))
  }).map(r => r.id)
}

async function claimOne(id) {
  try {
    const r = await claim(id)
    toast(r.text, r.ok ? 'ok' : 'err')
  } catch (e) { toast('签到失败：' + e.message, 'err') }
  await refresh()
}

/** 全部签到：逐区域发请求，但**只在最后刷新一次**——刷新要打上游查积分，4 个区域刷 4 次太慢。 */
async function claimAll() {
  const ids = pendingRegionIds()
  if (!ids.length) { toast('所有账号今日都已签到', 'ok'); return }
  const lines = []
  let anyOk = false
  for (const id of ids) {
    try {
      const r = await claim(id)
      anyOk = anyOk || r.ok
      lines.push(r.text)
    } catch (e) {
      lines.push(id + '：' + e.message)
    }
  }
  toast(lines.join('\n'), anyOk ? 'ok' : 'err')
  await refresh()
}

async function setDispatch(region, on) {
  const btn = document.getElementById('tg-' + region)
  if (btn) { btn.disabled = true; btn.textContent = '处理中…' }
  try {
    await api('/api/travel/enable', 'POST', { region, enabled: on })
    toast(on ? '已开启自动派遣' : '已暂停自动派遣（在途行程仍会照常领取）', on ? 'ok' : '')
  } catch (e) {
    toast('切换失败：' + e.message, 'err')
  }
  await refresh()
}

async function departOne(region, id) {
  try {
    const r = await api('/api/travel/depart', 'POST', { region, id })
    showDepart(r, '派遣结果')
  } catch (e) { toast('派遣失败：' + e.message, 'err') }
  await refresh()
}

async function departAll(region) {
  try {
    const r = await api('/api/travel/depart', 'POST', { region })
    showDepart(r, '全部派遣')
  } catch (e) { toast('派遣失败：' + e.message, 'err') }
  await refresh()
}

/**
 * 派遣结果。
 *
 * 成功时 hub 返回 { ok, status, data:{ region, results:[{id,label,ok,message}] } }，
 * results 挂在 data 上。409（并发占用）会被 api() 抛成异常，在调用处已提示。
 */
function showDepart(r, title) {
  const results = r && r.data && r.data.results
  if (!Array.isArray(results)) { toast((r && r.error) || '派遣无返回', 'err'); return }
  if (!results.length) { toast(title + '：没有可派遣的账号', ''); return }
  toast(title + '\n' + results.map(x => x.label + '：' + (x.message || (x.ok ? '已派出' : '失败'))).join('\n'),
    results.some(x => x.ok) ? 'ok' : 'err')
}

/* ================= 定时刷新 ================= */
const REFRESH_MS = 15 * 60 * 1000
const VISIBILITY_MIN_GAP_MS = 60 * 1000
let refreshTimer = null
let countdownTimer = null

function startAutoRefresh() {
  if (refreshTimer === null) {
    refreshTimer = setInterval(() => { if (!document.hidden) refresh() }, REFRESH_MS)
  }
  if (countdownTimer === null) {
    countdownTimer = setInterval(() => { if (!document.hidden) tickTravelCountdowns() }, 30 * 1000)
  }
}
function stopAutoRefresh() {
  if (refreshTimer !== null) { clearInterval(refreshTimer); refreshTimer = null }
  if (countdownTimer !== null) { clearInterval(countdownTimer); countdownTimer = null }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopAutoRefresh(); return }
  startAutoRefresh()
  if (Date.now() - lastRefreshAt >= VISIBILITY_MIN_GAP_MS) refresh()
})

refresh()
startAutoRefresh()
</script>
</body>
</html>
