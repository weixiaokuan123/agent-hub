<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Hub · 本地账号与签到面板</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --dim: #8b93a7; --accent: #5b8cff; --ok: #35c98a;
    --warn: #e0a234; --err: #e05252; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  header .sp { flex: 1; }
  .muted { color: var(--dim); font-size: 12.5px; }
  button { background: var(--card2); color: var(--fg); border: 1px solid var(--line);
    padding: 7px 14px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .card h2 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .row .k { color: var(--dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ok { background: var(--ok); } .off { background: #4a5060; } .warn { background: var(--warn); } .err { background: var(--err); }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .signin-box { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .streak { font-size: 22px; font-weight: 700; }
  .big { font-size: 16px; font-weight: 650; }
  .footer-note { margin-top: 26px; }
  code { background: var(--card2); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; }
  #toast { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    padding: 10px 14px; border-radius: 9px; max-width: 360px; font-size: 13px; }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Agent Hub</h1>
  <span class="tag" id="keyTag">未连接</span>
  <span class="tag" id="creditTag" title="WorkBuddy 全部账号积分总额">积分 —</span>
  <span class="sp"></span>
  <span class="muted" id="updated"></span>
  <button onclick="refresh()">刷新</button>
  <button class="primary" onclick="claimAll()">全部签到</button>
</header>
<main>
  <div class="grid" id="creditGrid"></div>
  <div class="grid" id="grid"></div>
  <p class="muted footer-note">
    数据来自本机各代理的回环接口（WorkBuddy 39301/39302、Trae 39303/39304、MiniMax 39305/39306、Qoder 39320）。
    本面板不接触任何凭据，只做聚合展示与「立即签到」。自动签到默认每天 7–10 点随机执行，由各代理自身完成；
    Qoder 因其奖励每日 10:00（UTC+8）刷新，签到窗口为 10 点之后。
  </p>
</main>
<div id="toast"></div>
<script>
const LS_KEY = 'agent-hub-key'
let HUB_KEY = localStorage.getItem(LS_KEY) || ''

// 首次通过 ?key= 带入并保存
const urlKey = new URLSearchParams(location.search).get('key')
if (urlKey) {
  HUB_KEY = urlKey
  localStorage.setItem(LS_KEY, urlKey)
  history.replaceState({}, '', location.pathname)
}

function toast(msg, kind = '') {
  const el = document.createElement('div')
  el.className = 'toast ' + kind
  el.textContent = msg
  document.getElementById('toast').appendChild(el)
  setTimeout(() => el.remove(), 5000)
}

async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization: 'Bearer ' + HUB_KEY, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  })
  if (res.status === 401) throw new Error('面板 key 无效或缺失')
  const data = await res.json().catch(() => null)
  if (!res.ok) throw new Error((data && (data.error || data.message)) || ('HTTP ' + res.status))
  return data
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

function authOf(r) {
  const a = r.auth || {}
  if (r.running === false) return { cls: 'off', text: '服务未运行' }
  if (a.state === 'signed-in') return { cls: 'ok', text: '已登录 ' + esc(a.account || a.uin || '') }
  if (a.state === 'expired') return { cls: 'warn', text: 'token 已过期' }
  if (a.state === 'signed-out') return { cls: 'off', text: '未登录' }
  if (a.state === 'no-key') return { cls: 'warn', text: '缺 key（首次启动后重试）' }
  return { cls: 'err', text: esc(a.message || a.state || '未知') }
}

function signinHtml(r) {
  if (!r.signin) return '<div class="row muted">签到：不可用</div>'
  if (r.signin.error) return '<div class="row muted">签到：' + esc(r.signin.error) + '</div>'
  const s = r.signin
  // 三种代理字段不同，这里做归一
  const raw = s.view || {}
  const nest = raw.panel || {}          // MiniMax: view.panel.{checkedInToday,streak,todayPoints}
  const inner = raw.panel?.panel || {}
  const checkedIn = raw.checkedIn === true || raw.todayCheckedIn === true || nest.checkedInToday === true
  const enabled = raw.enabled !== false && raw.active !== false
  const credits = raw.credits ?? raw.todayCredit ?? nest.todayPoints ?? 0
  const extra = raw.extraCredits ?? 0
  const streak = raw.streakDays ?? nest.streak ?? 0

  const state = checkedIn ? '<span class="dot ok"></span> 今日已签'
    : (enabled ? '<span class="dot warn"></span> 今日未签' : '<span class="dot off"></span> 活动未开启')
  return `
    <div class="signin-box">
      <div class="row"><span class="k">签到状态</span><span>${state}</span></div>
      <div class="row"><span class="k">获得积分</span><span class="big">${credits}${extra ? ' + ' + extra : ''}${streak ? ' · 连签' + streak : ''}</span></div>
      <div class="row"><span class="k">今日计划时刻</span><span>${esc(s.scheduledAt || '-')}</span></div>
      ${s.lastResult ? `<div class="row"><span class="k">最近结果</span><span class="muted">${esc(s.lastResult)}</span></div>` : ''}
      <div class="row" style="margin-top:8px">
        <span></span>
        <button onclick="claim('${r.id}')" ${checkedIn ? 'disabled' : ''}>立即签到</button>
      </div>
    </div>`
}

function card(r) {
  const a = authOf(r)
  const models = Array.isArray(r.models) ? r.models.length : (r.models ?? '-')
  return `
    <div class="card">
      <h2><span class="dot ${a.cls}"></span> ${esc(r.provider)} <span class="tag">${esc(r.label)}</span></h2>
      <div class="muted" style="margin-bottom:10px">端口 ${r.port}</div>
      <div class="row"><span class="k">账号</span><span>${a.text}</span></div>
      <div class="row"><span class="k">模型数</span><span>${models}</span></div>
      ${signinHtml(r)}
    </div>`
}

let refreshInFlight = false

async function refresh() {
  if (!HUB_KEY) { document.getElementById('keyTag').textContent = '缺少 key'; return }
  // 重入保护：定时器 / 切回标签页 / 手动点击可能同时触发，
  // 并发刷新会让 refreshCredits 的追加互相叠加造成卡片重复。
  if (refreshInFlight) return
  refreshInFlight = true
  try {
    const data = await api('/api/overview')
    document.getElementById('keyTag').textContent = '已连接'
    document.getElementById('grid').innerHTML = data.regions.map(card).join('')
    document.getElementById('updated').textContent = '更新于 ' + new Date(data.at).toLocaleTimeString()
  } catch (e) {
    toast('刷新失败：' + e.message, 'err')
    document.getElementById('keyTag').textContent = '连接失败'
  }
  try {
    await refreshCredits()
  } finally {
    refreshInFlight = false
  }
}

/** WorkBuddy 全部账号积分：总额徽章 + 按国内/国际分组明细（独立请求，失败不影响主面板）。 */
async function refreshCredits() {
  const tag = document.getElementById('creditTag')
  const grid = document.getElementById('creditGrid')
  try {
    const c = await api('/api/workbuddy/credits')
    tag.textContent = '积分 ' + (c.total ?? 0)
    const rowsOf = (entries) => (entries || []).map(e => {
      const who = e.account ? esc(e.account) : '(未识别账号)'
      const val = e.total === undefined
        ? '<span class="muted">' + esc(e.error || '不可用') + '</span>'
        : e.total + ' 分'
      return `<div class="row"><span>${who} <span class="muted">:${e.port}</span></span><b>${val}</b></div>`
    }).join('')
    const groups = c.groups || []
    const sections = groups.map(g => `
        <div class="row" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
          <span class="k">${esc(g.label)}</span><b>${g.total ?? 0} 分</b>
        </div>
        ${rowsOf(g.entries) || '<div class="row muted">无账号</div>'}
    `).join('')
    grid.innerHTML = `
      <div class="card">
        <h2>WorkBuddy 积分 <span class="tag">分区域 · 去重</span></h2>
        <div class="row"><span>合计</span><b>${c.total ?? 0} 分</b></div>
        ${sections || '<div class="row muted">暂无数据</div>'}
        <div class="row"><span class="muted">${c.note ? esc(c.note) + '；' : ''}每次刷新读取实时余额</span></div>
      </div>`
  } catch (e) {
    tag.textContent = '积分 —'
    grid.innerHTML = ''
  }
  // Trae 额度：独立请求，失败不影响 WorkBuddy 卡片
  try {
    const t = await api('/api/trae/credits')
    const num = v => (v === undefined ? '—' : Math.round(v * 100) / 100)
    const pct = t.ratio === undefined ? '' : ` (${(t.ratio * 100).toFixed(1)}%)`
    const card = `
      <div class="card">
        <h2>Trae 额度 <span class="tag">国内 · :${t.port}</span></h2>
        <div class="row"><span>剩余</span><b>${num(t.remaining)} 分</b></div>
        <div class="row"><span>已用 / 总额</span><b>${num(t.consumed)} / ${num(t.total)}${pct}</b></div>
        <div class="row"><span class="muted">${t.error ? esc(t.error) : '来自 /trae/api/v2/pay/ide_user_ent_usage'}</span></div>
      </div>`
    grid.innerHTML += card
  } catch (e) { /* Trae 额度不可用时静默 */ }
  // Qoder 账号 / 额度 / 签到：独立请求，失败不影响其它卡片
  try {
    const q = await api('/api/qoder/status')
    const regions = q.regions || []
    const rows = regions.map(r => {
      if (!r.loggedIn) {
        return `<div class="row" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
            <span class="k">${esc(r.label)}</span>
            <span class="muted">${esc(r.error || '未登录')}</span>
          </div>`
      }
      // 签到状态文案：已领 / 可领 / 未到刷新时间 / 该区域无活动
      let signinText
      if (r.todayCheckedIn === true) {
        signinText = '<span style="color:var(--ok)">今日已领</span>'
      } else if (r.claimable === true) {
        signinText = `<span style="color:var(--accent)">可领 ${r.claimableAmount ?? 0}</span>`
      } else if (r.hasBenefitCampaign === true) {
        signinText = '<span class="muted">未到刷新时间</span>'
      } else if (r.hasBenefitCampaign === false) {
        signinText = '<span class="muted">无每日签到活动</span>'
      } else {
        signinText = '<span class="muted">—</span>'
      }
      const credit = r.remaining === undefined
        ? '<span class="muted">额度未知</span>'
        : `<b>${r.remaining} / ${r.total ?? '?'} ${esc(r.unit || 'credits')}</b>`
      const streak = (r.streakDays !== undefined && r.streakDays > 0)
        ? ` <span class="muted">· 连续 ${r.streakDays} 天</span>` : ''
      // 有签到活动的区域才给「立即签到」按钮（国际版当前没有活动）。
      const claimableNow = r.hasBenefitCampaign === true
      const btn = claimableNow
        ? `<button data-qoder="${esc(r.region)}" data-pretty="Qoder ${esc(r.label)}"${r.todayCheckedIn === true ? ' disabled' : ''}>立即签到</button>`
        : ''
      return `<div class="row" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)">
          <span class="k">${esc(r.label)}</span>
          <b>${esc(r.account || '(未识别账号)')}</b>
        </div>
        <div class="row"><span class="muted">套餐</span><span>${esc(r.planName || '—')}</span></div>
        <div class="row"><span class="muted">额度</span><span>${credit}</span></div>
        <div class="row"><span class="muted">签到</span><span>${signinText}${streak}</span></div>
        <div class="row"><span class="muted">令牌</span><span class="muted">${esc(r.tokenExpiresIn || '—')}</span></div>
        ${btn ? `<div class="row">${btn}</div>` : ''}`
    }).join('')
    const card = `
      <div class="card">
        <h2>Qoder <span class="tag">国内 + 国际 · :39320</span></h2>
        <div class="row"><span>可用额度合计</span><b>${q.total ?? 0} credits</b></div>
        ${rows || '<div class="row muted">暂无数据</div>'}
        <div class="row"><span class="muted">${q.note ? esc(q.note) + '；' : ''}每日 10:00 后自动签到</span></div>
      </div>`
    grid.innerHTML += card
  } catch (e) { /* Qoder 不可用时静默 */ }
}

async function claim(id) {
  try {
    const r = await api('/api/signin/claim', 'POST', { id })
    const msg = r.entry?.result || r.results?.[0]?.message || '已处理'
    toast(id + '：' + msg, 'ok')
    refresh()
  } catch (e) { toast(id + ' 签到失败：' + e.message, 'err') }
}

/** 立即签到单个平台（data-claim 按钮）。 */
async function claimById(btn) {
  const id = btn.dataset.claim || btn.dataset.qoder
  const pretty = btn.dataset.pretty || id
  btn.disabled = true
  try {
    const r = await api('/api/signin/claim', 'POST', { id })
    // Qoder 返回 { results:[{message}] }，其它代理返回 { entry:{result} }
    const msg = r.entry?.result || r.results?.[0]?.message || '已处理'
    toast(pretty + '：' + msg, 'ok')
  } catch (e) {
    toast(pretty + ' 签到失败：' + e.message, 'err')
  } finally {
    btn.disabled = false
    refresh()
  }
}

async function claimAll() {
  try {
    const data = await api('/api/overview')
    const targets = data.regions.filter(r => r.signin && !r.signin.error && r.signin.view && !r.signin.view.checkedIn)
    // Qoder 不在 overview（单账号 per 区域、无 key），单独取一次
    let qoderTargets = []
    try {
      const q = await api('/api/qoder/status')
      qoderTargets = (q.regions || [])
        .filter(r => r.loggedIn && r.hasBenefitCampaign === true && r.todayCheckedIn !== true)
        .map(r => 'qoder:' + r.region)
    } catch (e) { /* Qoder 不可用时忽略 */ }
    const ids = targets.map(t => t.id).concat(qoderTargets)
    if (!ids.length) { toast('没有需要签到的平台'); return }
    for (const id of ids) { await claim(id) }
  } catch (e) { toast('批量签到失败：' + e.message, 'err') }
}

// 事件委托：Qoder 卡片里的「立即签到」按钮（data-qoder="cn|global"）。
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-qoder]')
  if (btn !== null) { claimById(btn); return }
})

// 自动刷新：5 分钟一次；标签页不可见时暂停，切回时立即刷新一次。
// 面板每次刷新都会向 WorkBuddy/Trae 上游查询余额，降低频率可避免频繁调用。
const REFRESH_MS = 5 * 60 * 1000
let refreshTimer = null

function startAutoRefresh() {
  if (refreshTimer !== null) return
  refreshTimer = setInterval(() => { if (!document.hidden) refresh() }, REFRESH_MS)
}

function stopAutoRefresh() {
  if (refreshTimer !== null) { clearInterval(refreshTimer); refreshTimer = null }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopAutoRefresh() }
  else { refresh(); startAutoRefresh() }
})

refresh()
startAutoRefresh()
</script>
</body>
</html>
